name: BeaverRNASEQPDX step2 check
version: 1
on:
  xdxtools:
    workflow: BeaverRNASEQPDX
    phase: step2-check
    modes: [RNASEQ]
defaults:
  shell: bash
  environment: xdxtools-core
  observability:
    metrics: task
    capture_stdout: true
    capture_stderr: true
    compress_success_logs: true
jobs:
  sample_artifacts:
    name: Validate BeaverRNASEQPDX step2 artifacts
    scope: sample
    dimensions: [sample, species]
    inputs:
      bam: "${{ config.directories.bsmap.main }}/${{ sample.id }}_${{ species.name }}.bam"
      bam_index: "${{ config.directories.bsmap.main }}/${{ sample.id }}_${{ species.name }}.bam.bai"
      qualimap_html: "${{ config.directories.qualimap }}/${{ sample.id }}_${{ species.name }}/qualimapReport.html"
      qualimap_pdf: "${{ config.directories.qualimap }}/${{ sample.id }}_${{ species.name }}/report.pdf"
    outputs:
      ready: "${{ config.directories.sid_log }}/step2-check/${{ sample.id }}_${{ species.name }}.ready"
    resources:
      cores: 1
      memory: 1G
      partition: cpu
    steps:
      - name: Record validated RNA-seq PDX artifacts
        run: |
          mkdir -p "$(dirname '${{ outputs.ready }}')"
          touch '${{ outputs.ready }}'

  patch_bam:
    name: Recalculate RNA-seq PDX BAM alignment tags
    scope: sample
    dimensions: [sample, species]
    inputs:
      validated: "${{ jobs.sample_artifacts.outputs.ready }}"
      bam: "${{ config.directories.bsmap.main }}/${{ sample.id }}_${{ species.name }}.bam"
      reference: "${{ species.genome_fasta }}"
    outputs:
      fixed_bam: "${{ config.directories.bsmap.main }}/${{ sample.id }}_fixed_${{ species.name }}.bam"
      success_marker: "${{ config.directories.bsmap.main }}/${{ sample.id }}_${{ species.name }}_pdx_patch_success"
    resources:
      cores: 4
      memory: 16G
      partition: cpu
    steps:
      - name: Run Picard SetNmMdAndUqTags
        run: |
          if [ -n "${CONDA_PREFIX:-}" ] && [ -x "${CONDA_PREFIX}/lib/jvm/bin/java" ]; then
            export JAVA_HOME="${CONDA_PREFIX}/lib/jvm"
          fi
          picard SetNmMdAndUqTags I='${{ inputs.bam }}' O='${{ outputs.fixed_bam }}' R='${{ inputs.reference }}' IS_BISULFITE_SEQUENCE=false
          touch '${{ outputs.success_marker }}'

  xenofilter:
    name: Filter host reads from RNA-seq PDX BAM files
    scope: global
    dimensions: []
    inputs:
      patched_bams: "${{ jobs.patch_bam.outputs.fixed_bam }}"
    outputs:
      success_marker: "${{ config.directories.bsmap.main }}/Filtered_bams/filtered_success.txt"
    resources:
      cores: 4
      memory: 16G
      partition: cpu
    steps:
      - name: Run RNA-seq Xenofilter
        run: |
          filtered_directory='${{ config.directories.bsmap.main }}/Filtered_bams'
          mkdir -p "$filtered_directory"
          temporary_filtered_directory="$(mktemp -d "${TMPDIR:-/tmp}/craftmake-xenofilter.XXXXXX")"
          trap 'rm -rf "$temporary_filtered_directory"' EXIT
          graft_bams=('${{ config.directories.bsmap.main }}'/*_fixed_'${{ config.workflow.species.graft }}'.bam)
          host_bams=('${{ config.directories.bsmap.main }}'/*_fixed_'${{ config.workflow.species.host }}'.bam)
          xenofilter_command=(xenofilter run)
          for graft_bam in "${graft_bams[@]}"; do xenofilter_command+=(--graft "$graft_bam"); done
          for host_bam in "${host_bams[@]}"; do xenofilter_command+=(--host "$host_bam"); done
          xenofilter_command+=(--output "$temporary_filtered_directory" --mm-threshold 4 --unmapped-penalty 8 --threads '${{ resources.cores }}' --recalculate-nm --graft-ref '${{ config.reference.graft_fasta }}' --host-ref '${{ config.reference.host_fasta }}')
          xenofilter_exit_code=0
          "${xenofilter_command[@]}" || xenofilter_exit_code=$?
          if (( xenofilter_exit_code != 0 )); then
            printf 'Xenofilter exited with code %d; validating generated outputs before deciding task status.\n' "$xenofilter_exit_code" >&2
          fi
          samtools_path="${SAMTOOLS:-samtools}"
          for graft_bam in "${graft_bams[@]}"; do
            sample_prefix="$(basename "$graft_bam" _fixed_'${{ config.workflow.species.graft }}'.bam)"
            temporary_filtered_bam="$temporary_filtered_directory/${sample_prefix}_fixed_${{ config.workflow.species.graft }}_Filtered.bam"
            if [[ ! -s "$temporary_filtered_bam" ]]; then
              printf 'Xenofilter did not produce a non-empty filtered BAM: %s\n' "$temporary_filtered_bam" >&2
              exit 1
            fi
            if [[ ! -s "$temporary_filtered_bam.bai" ]]; then
              printf 'Xenofilter did not produce a non-empty filtered BAM index: %s.bai\n' "$temporary_filtered_bam" >&2
              exit 1
            fi
            "$samtools_path" quickcheck -v "$temporary_filtered_bam"
            filtered_read_count="$("$samtools_path" view -c -F 4 "$temporary_filtered_bam")"
            if (( filtered_read_count <= 0 )); then
              printf 'Xenofilter filtered BAM has no mapped reads: %s\n' "$temporary_filtered_bam" >&2
              exit 1
            fi
          done
          for graft_bam in "${graft_bams[@]}"; do
            sample_prefix="$(basename "$graft_bam" _fixed_'${{ config.workflow.species.graft }}'.bam)"
            temporary_filtered_bam="$temporary_filtered_directory/${sample_prefix}_fixed_${{ config.workflow.species.graft }}_Filtered.bam"
            final_filtered_bam="$filtered_directory/${sample_prefix}_fixed_${{ config.workflow.species.graft }}_Filtered.bam"
            mv "$temporary_filtered_bam" "$final_filtered_bam"
            mv "$temporary_filtered_bam.bai" "$final_filtered_bam.bai"
          done
          touch '${{ outputs.success_marker }}'

  filtered_artifacts:
    name: Validate RNA-seq Xenofilter sample outputs
    scope: sample
    dimensions: [sample]
    inputs:
      filter_complete: "${{ jobs.xenofilter.outputs.success_marker }}"
      filtered_bam: "${{ config.directories.bsmap.main }}/Filtered_bams/${{ sample.id }}_fixed_${{ config.workflow.species.graft }}_Filtered.bam"
    outputs:
      ready: "${{ config.directories.sid_log }}/step2-check/${{ sample.id }}_filtered.ready"
    resources:
      cores: 1
      memory: 1G
      partition: cpu
    steps:
      - name: Record validated RNA-seq filtered BAM
        run: |
          mkdir -p "$(dirname '${{ outputs.ready }}')"
          touch '${{ outputs.ready }}'

  step2_checker:
    name: Check BeaverRNASEQPDX step2
    scope: global
    dimensions: []
    inputs:
      sample_artifacts: "${{ jobs.sample_artifacts.outputs.ready }}"
      patch_markers: "${{ jobs.patch_bam.outputs.success_marker }}"
      filtered_bams: "${{ jobs.filtered_artifacts.outputs.ready }}"
      filter_marker: "${{ jobs.xenofilter.outputs.success_marker }}"
    outputs:
      success_marker: "${{ config.directories.sid_log }}/step2_success.txt"
    resources:
      cores: 1
      memory: 1G
      partition: cpu
    steps:
      - name: Write step2 success marker
        run: |
          mkdir -p "$(dirname '${{ outputs.success_marker }}')"
          touch '${{ outputs.success_marker }}'
