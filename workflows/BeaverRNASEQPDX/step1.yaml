name: BeaverRNASEQPDX step1
version: 1
on:
  otter:
    workflow: BeaverRNASEQPDX
    phase: step1
    modes: [RNASEQ]
defaults:
  shell: bash
  environment: otter-core
  observability:
    metrics: task
    capture_stdout: true
    capture_stderr: true
    compress_success_logs: true
jobs:
  fastqc_before:
    name: FastQC before RNA-seq PDX trimming
    scope: sample
    dimensions: [sample]
    inputs:
      read1: "${{ config.output.raw_dir }}/${{ sample.id }}_R1.fastq.gz"
      read2: "${{ config.output.raw_dir }}/${{ sample.id }}_R2.fastq.gz"
    outputs:
      read1_data: "${{ config.directories.qc.before }}/${{ sample.id }}_R1_fastqcx/fastqc_data.txt"
      read2_data: "${{ config.directories.qc.before }}/${{ sample.id }}_R2_fastqcx/fastqc_data.txt"
    resources:
      cores: 2
      memory: 4G
      partition: cpu
    steps:
      - name: Run FastQC before trimming
        run: |
          mkdir -p "$(dirname '${{ outputs.read1_data }}')" "$(dirname '${{ outputs.read2_data }}')"
          fastqcx -q '${{ inputs.read1 }}' -s '${{ config.directories.qc.before }}/${{ sample.id }}_R1_fastqcx' --no-html
          fastqcx -q '${{ inputs.read2 }}' -s '${{ config.directories.qc.before }}/${{ sample.id }}_R2_fastqcx' --no-html

  trim_reads:
    name: Trim paired RNA-seq PDX reads
    scope: sample
    dimensions: [sample]
    inputs:
      read1: "${{ config.output.raw_dir }}/${{ sample.id }}_R1.fastq.gz"
      read2: "${{ config.output.raw_dir }}/${{ sample.id }}_R2.fastq.gz"
    outputs:
      read1: "${{ config.output.trim_dir }}/${{ sample.id }}_val_1.fq.gz"
      read2: "${{ config.output.trim_dir }}/${{ sample.id }}_val_2.fq.gz"
      read1_report: "${{ config.output.trim_dir }}/${{ sample.id }}_R1.fastq.gz_trimming_report.txt"
      read2_report: "${{ config.output.trim_dir }}/${{ sample.id }}_R2.fastq.gz_trimming_report.txt"
    resources:
      cores: 6
      memory: 8G
      partition: cpu
    steps:
      - name: Run Trim Galore
        run: |
          mkdir -p '${{ config.output.trim_dir }}'
          command=(trim_galore -e '${{ config.workflow.adapters.error }}' -j '${{ resources.cores }}' --basename '${{ sample.id }}' --paired -o '${{ config.output.trim_dir }}')
          if [ '${{ sample.adapter1 }}' != 'NO_ADAPTER_CAL_USE_DEFAULT' ]; then command+=(--adapter '${{ sample.adapter1 }}'); fi
          if [ '${{ sample.adapter2 }}' != 'NO_ADAPTER_CAL_USE_DEFAULT' ]; then command+=(--adapter2 '${{ sample.adapter2 }}'); fi
          if [ '${{ config.workflow.alignment.c1 }}' -ne 0 ]; then command+=(--clip_R1 '${{ config.workflow.alignment.c1 }}'); fi
          if [ '${{ config.workflow.alignment.c2 }}' -ne 0 ]; then command+=(--clip_R2 '${{ config.workflow.alignment.c2 }}'); fi
          if [ '${{ config.workflow.alignment.t1 }}' -ne 0 ]; then command+=(--three_prime_clip_R1 '${{ config.workflow.alignment.t1 }}'); fi
          if [ '${{ config.workflow.alignment.t2 }}' -ne 0 ]; then command+=(--three_prime_clip_R2 '${{ config.workflow.alignment.t2 }}'); fi
          command+=('${{ inputs.read1 }}' '${{ inputs.read2 }}')
          "${command[@]}"

  fastqc_after:
    name: FastQC after RNA-seq PDX trimming
    scope: sample
    dimensions: [sample]
    inputs:
      read1: "${{ jobs.trim_reads.outputs.read1 }}"
      read2: "${{ jobs.trim_reads.outputs.read2 }}"
    outputs:
      read1_data: "${{ config.directories.qc.after }}/${{ sample.id }}_val_1_fastqcx/fastqc_data.txt"
      read2_data: "${{ config.directories.qc.after }}/${{ sample.id }}_val_2_fastqcx/fastqc_data.txt"
    resources:
      cores: 2
      memory: 4G
      partition: cpu
    steps:
      - name: Run FastQC after trimming
        run: |
          mkdir -p "$(dirname '${{ outputs.read1_data }}')" "$(dirname '${{ outputs.read2_data }}')"
          fastqcx -q '${{ inputs.read1 }}' -s '${{ config.directories.qc.after }}/${{ sample.id }}_val_1_fastqcx' --no-html
          fastqcx -q '${{ inputs.read2 }}' -s '${{ config.directories.qc.after }}/${{ sample.id }}_val_2_fastqcx' --no-html

  step1_checker:
    name: Check BeaverRNASEQPDX step1
    scope: global
    dimensions: []
    needs: [fastqc_before, trim_reads, fastqc_after]
    inputs:
      before_read1: "${{ jobs.fastqc_before.outputs.read1_data }}"
      before_read2: "${{ jobs.fastqc_before.outputs.read2_data }}"
      trimmed_read1: "${{ jobs.trim_reads.outputs.read1 }}"
      trimmed_read2: "${{ jobs.trim_reads.outputs.read2 }}"
      trimmed_read1_report: "${{ jobs.trim_reads.outputs.read1_report }}"
      trimmed_read2_report: "${{ jobs.trim_reads.outputs.read2_report }}"
      after_read1: "${{ jobs.fastqc_after.outputs.read1_data }}"
      after_read2: "${{ jobs.fastqc_after.outputs.read2_data }}"
    outputs:
      success_marker: "${{ config.directories.sid_log }}/step1_success.txt"
    resources:
      cores: 5
      memory: 2G
      partition: cpu
    steps:
      - name: Write step1 success marker
        run: |
          mkdir -p "$(dirname '${{ outputs.success_marker }}')"
          touch '${{ outputs.success_marker }}'
